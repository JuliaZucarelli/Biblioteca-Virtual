<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="img/Favicon-Biblioteca-Virtual.png">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Biblioteca Virtual</title>
</head>
<body>
    <div class="layout">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <img class="sidebar_logo" src="img/logo-horizontal-Biblioteca-Virtual.png" alt="logo horizontal da plataforma Biblioteca Virtural">

            <nav class="sidebar_nav">
                <a class="nav-item" href="index.html">
                    <svg class="nav-item__icon" aria-hidden="true"><use href="img/icons/icon-inicio.svg"></use></svg>
                    início
                </a>
                <a class="nav-item" href="emprestimos.html">
                    <svg class="nav-item__icon" aria-hidden="true"><use href="img/icons/icon-emprestimo.svg"></use></svg>
                    empréstimos
                </a>
                <a class="nav-item" href="historico.html">
                    <svg class="nav-item__icon" aria-hidden="true"><use href="img/icons/icon-historico.svg"></use></svg>
                    histórico
                </a>
                <a class="nav-item" href="conta.html">
                    <svg class="nav-item__icon" aria-hidden="true"><use href="img/icons/icon-conta.svg"></use></svg>
                    conta
                </a>
            </nav>

            <div class="sidebar__profile">
                <div class="avatar avatar--profile">JZ</div>
                <div class="sidebar__profile-info">
                    <p class="sidebar__profile-name">Julia Zucareli</p>
                    <p class="sidebar__profile_role">membro</p>
                </div>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <div class="main">
            <!-- TOPBAR -->
             <header class="topbar">
                <div class="search-bar search-bar--compact">
                    <input type="text" name="userSearchBarFull" id="searchBarFull" placeholder="busca rápida...">
                </div>

                <div class="topbar__actions">
                    <!-- adicionar link para abrir na pagina conta -->
                    <button class="icon-button" aria-label="Ver notificações">
                        <svg class="icon-button__icon" aria-hidden="true"><use href="img/icons/icon-notificacao.svg"></use></svg>
                    </button>
                    <button class="avatar avatar--button" aria-label="Abrir conta">JZ</button>
                </div>
             </header>

             <section>
                <!-- HERO -->
                <h2>Minha conta</h2>

                <section>
                    <div class="perfil-grid">
                        <article class="perfil-card">
                            <div class="perfil-card__foto perfil--foto">
                                <input type="file" name="" id="">
                            </div>

                            <div class="perfil-card__body">
                                <h2 class="perfil-card__name">Julia Zucareli</h2>
                                <p class="perfil-card__email">email</p>
                                <p class="perfil-card__function">membro desde jan. 2026</p>
                            </div>
                        </article>

                        <article class="emprestimos-ativos-card">
                            <h2 class="emprestimos-ativos-card__number">3</h2>
                            <p class="emprestimos-ativos-card__text">empréstimos ativos</p>
                        </article>

                        <article class="emprestimos-ativos-card">
                            <h2 class="emprestimos-ativos-card__number">47</h2>
                            <p class="emprestimos-ativos-card__text">livros lidos</p>
                        </article>

                        <article class="emprestimos-ativos-card">
                            <h2 class="emprestimos-ativos-card__valor">R$12,50</h2>
                            <p class="emprestimos-ativos-card__text">multa pendente</p>
                        </article>

                        <article class="emprestimos-ativos-card">
                            <h2 class="emprestimos-ativos-card__renovation">2</h2>
                            <p class="emprestimos-ativos-card__text">renovações</p>
                        </article>

                        <article class="preferencia-card">
                            <h4 class="preferencia-card__preference">Preferências</h4>
                            <p class="preferencia-card__text">alterar senha</p>
                            <p class="preferencia-card__text">trocal email</p>
                            <p class="preferencia-card__text">sair da conta</p>
                        </article>
                    </div>
                </section>
             </section>

             <main class="content">
             
            </main>
        </div>
    </div>

    
</body>
</html>
